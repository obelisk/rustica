[package]
name = "rustica-agent"
version = "0.12.1"
authors = ["Mitchell Grenier <mitchell@confurious.io>"]
edition = "2021"

[features]
default = ["mozilla"]
mozilla = ["sshcerts/fido-support-mozilla", "sshcerts/yubikey-support"]
ctap2_hid = ["sshcerts/fido-support", "sshcerts/yubikey-support"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
async-trait = "0.1"
base64 = "0.13"
byteorder = "1.4.2"
env_logger = "0.8.2"
hex = "0.4.2"
log = "0.4.13"
pcsc = "2.9"
prost = "0.11"
ring = "0.17"
serde = "1.0.97"
serde_derive = "1.0"
sha2 = "0.9.2"
sshcerts = { version = "0.15.1" }
tokio = { version = "1", features = ["full"] }
toml = "0.7"
tonic = { version = "0.9", features = ["tls"] }
yubikey = { version = "0.9.0-pre.0", features = ["untested"] }
x509-parser = { version = "0.15", features = ["verify"] }

# Dependencies for allowed_signers feature
zstd = "0.13.1"

[build-dependencies]
tonic-build = "0.9"

[lib]
name = "rustica_agent"
crate-type = ["staticlib", "rlib"]
